global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'quizhub-backend-1'
    static_configs:
      - targets: ['backend-1:8000']
    metrics_path: '/metrics'

  - job_name: 'quizhub-backend-2'
    static_configs:
      - targets: ['backend-2:8000']
    metrics_path: '/metrics'
